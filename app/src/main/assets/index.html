<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#172554" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icon.svg" />
  <title>账单工坊 · 业务账单生成器</title>
  <style>
    :root { --ink:#172554; --blue:#2563eb; --soft:#eef4ff; --line:#dbe3ee; --muted:#64748b; --canvas:#f5f7fb; }
    * { box-sizing:border-box; } body { margin:0; font-family:"Microsoft YaHei","Noto Sans SC",Arial,sans-serif; color:var(--ink); background:var(--canvas); }
    button,input,textarea { font:inherit; } button { cursor:pointer; border:0; } .app { display:grid; grid-template-columns:400px 1fr; min-height:100vh; }
    .panel { background:#fff; border-right:1px solid var(--line); padding:28px 26px; overflow:auto; } .brand { display:flex; gap:12px; align-items:center; margin-bottom:29px; }
    .brand-mark { width:42px; height:42px; border-radius:12px; background:var(--blue); display:grid; place-items:center; color:white; font-size:23px; font-weight:800; } .brand strong{display:block;font-size:18px}.brand span{display:block;font-size:12px;color:var(--muted);margin-top:2px}
    h2 { font-size:14px; margin:25px 0 13px; letter-spacing:.08em; color:var(--muted); } label { display:block; color:#475569; font-size:13px; margin:12px 0 6px; }
    input, textarea { width:100%; border:1px solid var(--line); border-radius:8px; padding:10px 11px; outline:none; color:var(--ink); background:#fff; } input:focus,textarea:focus{border-color:var(--blue);box-shadow:0 0 0 3px #dbeafe} textarea{resize:vertical;min-height:56px} input:disabled,textarea:disabled{background:#f8fafc;color:#64748b;cursor:not-allowed;opacity:1}
    .two { display:grid;grid-template-columns:1fr 1fr;gap:12px; } .items-editor { border:1px solid var(--line); border-radius:10px; padding:10px; }
    .lock-control{display:flex;justify-content:space-between;align-items:center;margin:25px 0 13px}.lock-control h2{margin:0}.lock-button{background:#eef2f7;color:var(--ink);border-radius:7px;padding:6px 9px;font-size:12px;font-weight:700}.lock-button.unlocked{background:#fff7ed;color:#c2410c}.item-row { display:grid; grid-template-columns:minmax(0,2.9fr) minmax(0,2fr) minmax(40px,.7fr) minmax(68px,1.15fr) 20px; gap:6px; margin:7px 0; align-items:center; } .item-row input { min-width:0;padding:8px 6px; font-size:12px; } .remove { color:#94a3b8;background:transparent;font-size:20px; }.remove:hover{color:#ef4444}
    .add { width:100%; background:var(--soft); color:var(--blue); border-radius:8px; padding:9px; font-size:13px; font-weight:700; margin-top:7px; } .actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:27px}.actions .wide{grid-column:1/-1}.primary{background:var(--blue);color:white;border-radius:9px;padding:12px;font-weight:700}.secondary{background:#eef2f7;color:var(--ink);border-radius:9px;padding:12px;font-weight:700}
    .workspace { padding:42px; overflow:auto; } .toolbar{display:flex;align-items:center;justify-content:space-between;max-width:1000px;margin:0 auto 22px}.toolbar span{color:var(--muted);font-size:14px}.status{color:#16a34a!important;font-weight:700}.invoice { width:100%; max-width:1000px; min-height:1300px; margin:auto; background:#fff; border-radius:14px; box-shadow:0 16px 45px #17255418; overflow:hidden; padding:56px 60px; position:relative; }
    .topline{position:absolute;top:0;left:0;right:0;height:17px;background:var(--ink)} .invoice-head{display:flex;justify-content:space-between;align-items:start;border-bottom:1px solid var(--line);padding-bottom:30px}.identity{display:flex;align-items:center;gap:13px}.logo{width:62px;height:62px;border-radius:16px;background:var(--blue);display:grid;place-items:center;color:white;font-size:32px;font-weight:800}.studio{font-size:20px;font-weight:800}.english{font-size:12px;color:var(--muted);letter-spacing:.08em;margin-top:5px}.invoice-title{text-align:right}.invoice-title h1{font-size:44px;margin:0;letter-spacing:.1em}.invoice-title p{margin:7px 0 0;color:var(--muted);font-size:13px}
    .meta{display:grid;grid-template-columns:1fr 1fr;gap:30px;padding:34px 0 45px}.eyebrow{font-size:12px;color:var(--muted);letter-spacing:.1em;margin-bottom:10px}.customer-name{font-size:21px;font-weight:800;margin-bottom:8px}.detail{color:var(--muted);font-size:14px;line-height:1.75}.meta-right{justify-self:end;min-width:290px}.info-line{display:flex;justify-content:space-between;gap:25px;margin:7px 0;font-size:14px}.info-line span{color:var(--muted)}
    table{width:100%;border-collapse:collapse;table-layout:fixed}th{background:var(--soft);font-size:12px;color:var(--muted);letter-spacing:.08em;text-align:left;padding:15px 12px}th:first-child{width:52%;border-radius:8px 0 0 8px}th:nth-child(2){width:12%;text-align:right}th:nth-child(3){width:18%;text-align:right}th:last-child{width:18%;border-radius:0 8px 8px 0;text-align:right}td{border-bottom:1px solid var(--line);padding:20px 12px;vertical-align:top;font-size:15px}td:nth-child(2),td:nth-child(3),td:last-child{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}.service{font-weight:800;font-size:16px;overflow-wrap:anywhere}.sum{width:43%;margin:34px 0 0 auto}.sum-line{display:flex;justify-content:space-between;padding:9px 0;color:var(--muted)}.sum-line.total{color:var(--ink);font-weight:800;border-top:1px solid var(--line);margin-top:5px;padding-top:18px;font-size:19px}.sum-line.total b{color:var(--blue);font-size:31px}
    .payment{margin-top:58px;background:#f8fafc;border-radius:10px;padding:22px 25px}.payment h3,.notes h3{margin:0 0 10px;font-size:17px}.payment p,.notes p{margin:4px 0;color:var(--muted);font-size:13px;line-height:1.7}.notes{margin-top:42px;border-bottom:1px solid var(--line);padding-bottom:27px}.footer{display:flex;justify-content:space-between;color:var(--muted);font-size:12px;padding-top:20px}.uploaded-images{display:flex;flex-wrap:wrap;gap:12px;margin-top:24px}.uploaded-images:empty{display:none}.uploaded-images img{max-width:180px;max-height:150px;object-fit:contain;border:1px solid var(--line);border-radius:8px;padding:4px}
    .uploaded-images{display:flex;flex-wrap:wrap;gap:12px;margin-top:24px}.uploaded-images:empty{display:none}.uploaded-images img{max-width:180px;max-height:150px;object-fit:contain;border:1px solid var(--line);border-radius:8px;padding:4px}
    @media (max-width:900px){.app{grid-template-columns:1fr}.panel{border-right:0;border-bottom:1px solid var(--line);padding:20px 16px;overflow:visible}.workspace{padding:16px 10px;overflow:auto}.invoice{padding:34px 22px;min-width:0;min-height:auto;border-radius:10px}.toolbar{min-width:0;margin:0 auto 12px}.invoice-head{gap:14px}.logo{width:48px;height:48px;font-size:25px;border-radius:13px}.studio{font-size:17px;overflow-wrap:anywhere}.english{font-size:11px}.invoice-title h1{font-size:30px}.invoice-title p{font-size:11px}.meta{grid-template-columns:1fr;gap:20px;padding:25px 0 30px}.meta-right{justify-self:stretch;min-width:0}.info-line{max-width:360px}table{font-size:12px}th{padding:11px 6px;font-size:11px}th:first-child{width:46%}th:nth-child(2){width:12%}th:nth-child(3){width:20%}th:last-child{width:22%}td{padding:14px 6px;font-size:12px}.service{font-size:14px}.detail{font-size:11px;line-height:1.5}.sum{width:min(100%,340px);margin-top:25px}.sum-line.total b{font-size:25px}.payment{margin-top:36px;padding:18px}.notes{margin-top:28px}.footer{gap:12px;flex-wrap:wrap}.item-row{grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) 44px 78px 20px}.actions{margin-top:18px}}
    @media (max-width:420px){.invoice{padding:30px 14px}.identity{gap:9px}.invoice-title h1{font-size:25px}.invoice-title p{max-width:120px}.item-row{grid-template-columns:minmax(0,1fr) minmax(0,.8fr) 38px 68px 18px;gap:4px}.item-row input{font-size:11px;padding:7px 4px}.remove{font-size:18px}td,th{padding-left:4px;padding-right:4px}.sum-line.total{font-size:16px}.sum-line.total b{font-size:22px}}
    @media print { body{background:white}.panel,.toolbar{display:none}.app{display:block}.workspace{padding:0}.invoice{box-shadow:none;border-radius:0;max-width:none;min-height:auto;width:100%} }
  </style>
</head>
<body>
<main class="app">
  <aside class="panel">
    <div class="brand"><div class="brand-mark">▤</div><div><strong>账单工坊</strong><span>个人业务账单生成器</span></div></div>
    <div class="lock-control"><h2>开具方</h2><button class="lock-button" id="issuerLock">解锁编辑</button></div>
    <label>名称<input id="issuer" value="我的工作室" disabled></label>
    <label>联系信息<textarea id="issuerContact" disabled></textarea></label>
    <label>收款信息<textarea id="paymentInfo" disabled>请在此填写收款方式</textarea></label>
    <h2>客户与账单</h2>
    <label>客户名称<input id="customer" value="客户名称"></label>
    <label>客户信息<textarea id="customerDetail"></textarea></label>
    <div class="two"><label>账单编号<input id="number" value=""></label><label>开具日期<input id="date" type="date"></label></div>
    <label>付款到期日<input id="due" type="date"></label>
    <label>添加图片<input id="imageFiles" type="file" accept="image/*" multiple></label>
    <h2>服务明细</h2>
    <div id="items" class="items-editor"></div><button class="add" id="addItem">＋ 添加服务项目</button>
    <div class="lock-control"><h2>补充说明</h2><button class="lock-button" id="noteLock">解锁编辑</button></div>
    <textarea id="note" disabled>本单据用于双方业务结算与付款确认，不作为税务凭证使用。</textarea>
    <div class="actions"><button class="secondary" id="save">保存草稿</button><button class="primary" id="print">导出 / 打印</button><button class="secondary wide" id="exportImage">导出图片（PNG）</button></div>
    <div class="actions"><button class="secondary" id="saveDefaults">保存为默认数据</button><button class="secondary" id="restoreDefaults">恢复默认数据</button></div>
  </aside>
  <section class="workspace"><div class="toolbar"><span>实时预览</span><span class="status" id="saved">● 自动计算中</span></div>
    <article class="invoice"><div class="topline"></div><header class="invoice-head"><div class="identity"><div class="logo">▤</div><div><div class="studio" id="pIssuer">我的工作室</div><div class="english" id="pContact"></div></div></div><div class="invoice-title"><h1>业务账单</h1><p>INVOICE · 非税务发票</p></div></header>
      <section class="meta"><div><div class="eyebrow">账单客户</div><div class="customer-name" id="pCustomer"></div><div class="detail" id="pCustomerDetail"></div></div><div class="meta-right"><div class="eyebrow">账单信息</div><div class="info-line"><span>账单编号</span><b id="pNumber"></b></div><div class="info-line"><span>开具日期</span><b id="pDate"></b></div><div class="info-line"><span>付款到期</span><b id="pDue"></b></div></div></section>
      <table><thead><tr><th>项目 / 服务</th><th>数量</th><th>单价</th><th>金额</th></tr></thead><tbody id="pItems"></tbody></table>
      <section class="sum"><div class="sum-line"><span>小计</span><span id="subtotal"></span></div><div class="sum-line total"><span>应付总额</span><b id="total"></b></div></section>
      <section class="payment"><h3>收款信息</h3><p id="pPayment"></p></section><section class="notes"><h3>备注</h3><p id="pNote"></p></section><div class="uploaded-images" id="pImages"></div><footer class="footer"><span>感谢你的信任与合作。</span></footer>
    </article>
  </section>
</main>
<script>
  const $ = id => document.getElementById(id);
  const defaultItems = [
    {name:'品牌视觉方案设计', detail:'品牌方向梳理、主视觉与应用规范', qty:1, price:6800},
    {name:'社交媒体配图制作', detail:'6 张内容配图，含 2 轮修改', qty:6, price:350},
    {name:'项目沟通与交付支持', detail:'远程会议、文件整理及最终交付', qty:1, price:600}
  ];
  const fields=['issuer','issuerContact','paymentInfo','customer','customerDetail','number','date','due','note'];
  let invoiceImages=JSON.parse(localStorage.getItem('invoice-images')||'[]');
  function applyData(data){ fields.forEach(id=>{if(data[id]!==undefined)$(id).value=data[id];}); items=data.items||defaultItems.map(x=>({...x})); invoiceImages=data.images||[]; renderEditors(); update(); }
  function readData(){ const data={}; fields.forEach(id=>data[id]=$(id).value); data.items=items; data.images=invoiceImages; return data; }
  const initialDefaults=JSON.parse(localStorage.getItem('invoice-defaults')||'null');
  let items=initialDefaults?.items||JSON.parse(localStorage.getItem('invoice-items')||'null')||defaultItems;
  const formatter = new Intl.NumberFormat('zh-CN',{style:'currency',currency:'CNY'});
  const dateText = value => value ? new Date(value+'T00:00:00').toLocaleDateString('zh-CN',{year:'numeric',month:'long',day:'numeric'}) : '—';
  function escapeHTML(v){ return String(v).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c])); }
  function renderEditors(){ $('items').innerHTML = items.map((item,i)=>`<div class="item-row"><input data-i="${i}" data-k="name" value="${escapeHTML(item.name)}" title="项目名称"><input data-i="${i}" data-k="detail" value="${escapeHTML(item.detail||'')}" title="服务说明"><input data-i="${i}" data-k="qty" type="number" min="1" value="${item.qty}" title="数量"><input data-i="${i}" data-k="price" type="number" min="0" value="${item.price}" title="单价"><button class="remove" data-remove="${i}" title="删除">×</button></div>`).join(''); }
  function update(){
    const value = id => $(id).value; $('pIssuer').textContent=value('issuer'); $('pCustomer').textContent=value('customer'); $('pCustomerDetail').innerHTML=escapeHTML(value('customerDetail')).replace(/\n/g,'<br>'); $('pNumber').textContent=value('number'); $('pDate').textContent=dateText(value('date')); $('pDue').textContent=dateText(value('due')); $('pPayment').innerHTML=escapeHTML(value('paymentInfo')).replace(/\n/g,'<br>'); $('pNote').textContent=value('note'); $('pContact').innerHTML=escapeHTML(value('issuerContact')).replace(/\n/g,'<br>'); $('pImages').innerHTML=invoiceImages.map(src=>'<img src="'+src+'" alt="账单图片">').join('');
    let total=0; $('pItems').innerHTML=items.map(item=>{ const amount=Number(item.qty||0)*Number(item.price||0); total+=amount; const detail=item.detail ? `<div class="detail">${escapeHTML(item.detail)}</div>` : ''; return `<tr><td><div class="service">${escapeHTML(item.name)}</div>${detail}</td><td>${item.qty}</td><td>${formatter.format(item.price)}</td><td><b>${formatter.format(amount)}</b></td></tr>`}).join(''); $('subtotal').textContent=formatter.format(total); $('total').textContent=formatter.format(total); $('saved').textContent='● 已实时更新';
  }
  let issuerLocked = true;
  function setIssuerLock(locked){ issuerLocked=locked; ['issuer','issuerContact','paymentInfo'].forEach(id=>$(id).disabled=locked); const button=$('issuerLock'); button.textContent=locked?'解锁编辑':'锁定开具方'; button.classList.toggle('unlocked',!locked); if(locked){localStorage.setItem('invoice-default-issuer',JSON.stringify({issuer:$('issuer').value,issuerContact:$('issuerContact').value,paymentInfo:$('paymentInfo').value}));localStorage.setItem('invoice-issuer-locked','1');}else{localStorage.setItem('invoice-issuer-locked','0');} }
  let noteLocked = true;
  function setNoteLock(locked){ noteLocked=locked; $('note').disabled=locked; const button=$('noteLock'); button.textContent=locked?'解锁编辑':'固定说明'; button.classList.toggle('unlocked',!locked); }
  function persist(showStatus=true){ const data=readData(); fields.forEach(id=>localStorage.setItem('invoice-'+id,data[id])); localStorage.setItem('invoice-items',JSON.stringify(items));localStorage.setItem('invoice-images',JSON.stringify(invoiceImages)); if(showStatus)$('saved').textContent='● 草稿已自动保存'; }
  let saveTimer; function scheduleDraftSave(){clearTimeout(saveTimer);saveTimer=setTimeout(()=>persist(),250);}
  window.addEventListener('pagehide',()=>persist(false)); window.addEventListener('beforeunload',()=>persist(false)); document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')persist(false);});
  function restore(){ const ids=['issuer','issuerContact','paymentInfo','customer','customerDetail','number','note']; ids.forEach(id=>{const v=localStorage.getItem('invoice-'+id);if(v!==null)$(id).value=v;}); const today=new Date(); const localToday=new Date(today.getTime()-today.getTimezoneOffset()*60000).toISOString().slice(0,10); $('date').value=localToday; $('due').value=localToday; }
  $('items').addEventListener('input',e=>{if(!e.target.dataset.k)return;const i=e.target.dataset.i,k=e.target.dataset.k;items[i][k]=k==='qty'||k==='price'?Number(e.target.value):e.target.value; update();scheduleDraftSave();});
  $('items').addEventListener('click',e=>{if(e.target.dataset.remove!==undefined){items.splice(Number(e.target.dataset.remove),1);renderEditors();update();scheduleDraftSave();}});
  $('imageFiles').addEventListener('change',async e=>{for(const file of e.target.files){if(!file.type.startsWith('image/'))continue;const data=await new Promise(resolve=>{const reader=new FileReader();reader.onload=()=>resolve(reader.result);reader.readAsDataURL(file);});invoiceImages.push(data);}e.target.value='';update();persist();});
  function exportImage(){const node=$('.invoice');const r=node.getBoundingClientRect();const scale=2;const canvas=document.createElement('canvas');canvas.width=Math.ceil(r.width*scale);canvas.height=Math.ceil(r.height*scale);const ctx=canvas.getContext('2d');ctx.scale(scale,scale);ctx.fillStyle='#fff';ctx.fillRect(0,0,r.width,r.height);const html='<!doctype html><html><head><meta charset="utf-8"><style>'+document.querySelector('style').textContent+'</style></head><body style="margin:0;background:#fff"><article class="invoice" style="margin:0;box-shadow:none;border-radius:0;width:'+r.width+'px">'+node.innerHTML+'</article></body></html>';const blob=new Blob([html],{type:'text/html'});const url=URL.createObjectURL(blob);const frame=document.createElement('iframe');frame.style.cssText='position:fixed;left:-10000px;top:0;width:'+r.width+'px;height:'+r.height+'px;border:0';document.body.appendChild(frame);frame.onload=()=>{const doc=frame.contentDocument;const finish=()=>{ctx.drawWindow?ctx.drawWindow(frame.contentWindow,0,0,r.width,r.height,'#fff'):null;};setTimeout(()=>{const svg='<svg xmlns="http://www.w3.org/2000/svg" width="'+r.width+'" height="'+r.height+'"><foreignObject width="100%" height="100%"><div xmlns="http://www.w3.org/1999/xhtml">'+html.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')+'</div></foreignObject></svg>';const img=new Image();img.onload=()=>{ctx.drawImage(img,0,0,r.width,r.height);canvas.toBlob(png=>{const a=document.createElement('a');a.href=URL.createObjectURL(png);a.download=($('number').value||'business-invoice')+'.png';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);frame.remove();URL.revokeObjectURL(url);},'image/png');};img.onerror=()=>{frame.remove();URL.revokeObjectURL(url);alert('图片导出失败，请使用“导出 / 打印”并选择另存为 PDF。');};img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg);},500);};frame.src=url;}
  $('addItem').onclick=()=>{items.push({name:'',detail:'',qty:1,price:0});renderEditors();update();scheduleDraftSave();}; $('save').onclick=()=>persist(); $('print').onclick=()=>window.print(); $('exportImage').onclick=exportImage; $('saveDefaults').onclick=()=>{const data=readData();data.date='';data.due='';localStorage.setItem('invoice-defaults',JSON.stringify(data));localStorage.setItem('invoice-default-issuer',JSON.stringify({issuer:data.issuer,issuerContact:data.issuerContact,paymentInfo:data.paymentInfo}));localStorage.setItem('invoice-default-note',data.note);localStorage.setItem('invoice-issuer-locked',issuerLocked?'1':'0');localStorage.setItem('invoice-note-locked',noteLocked?'1':'0');location.reload();}; $('restoreDefaults').onclick=()=>{['customer','customerDetail','number','date','due'].forEach(id=>{localStorage.setItem('invoice-'+id,'');$(id).value='';});items=[];invoiceImages=[];localStorage.setItem('invoice-items','[]');localStorage.setItem('invoice-images','[]');renderEditors();update();persist(false);}; $('issuerLock').onclick=()=>setIssuerLock(!issuerLocked); $('noteLock').onclick=()=>{if(!noteLocked)localStorage.setItem('invoice-default-note',$('note').value);setNoteLock(!noteLocked);if(noteLocked)localStorage.setItem('invoice-default-note',$('note').value);}; document.querySelectorAll('input,textarea').forEach(e=>e.addEventListener('input',()=>{update();scheduleDraftSave();})); restore(); if(initialDefaults)applyData(initialDefaults); const savedIssuer=JSON.parse(localStorage.getItem('invoice-default-issuer')||'null'); if(savedIssuer){$('issuer').value=savedIssuer.issuer;$('issuerContact').value=savedIssuer.issuerContact;$('paymentInfo').value=savedIssuer.paymentInfo;} const savedNote=localStorage.getItem('invoice-default-note'); if(savedNote!==null)$('note').value=savedNote; const today=new Date();const localToday=new Date(today.getTime()-today.getTimezoneOffset()*60000).toISOString().slice(0,10);$('date').value=localToday;$('due').value=localToday;setIssuerLock(localStorage.getItem('invoice-issuer-locked')!=='0'); setNoteLock(localStorage.getItem('invoice-note-locked')!=='0'); renderEditors(); update();
  if('serviceWorker' in navigator && location.protocol!=='file:') navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script>
</body>
</html>
